cost function:
  cost type: 4D-Var
  time window:
    begin: 2010-01-01T03:00:00Z
    length: P1D
  geometry:
    resol: 40
  model:
    f: 8.0
    name: L95
    tstep: PT1H30M
  analysis variables: [x]
  background:
    date: 2010-01-01T03:00:00Z
    filename: Data/forecast.fc.2010-01-01T00:00:00Z.PT3H.l95
  background error:
    covariance model: L95Error
    date: 2010-01-01T03:00:00Z
    length_scale: 1.0
    standard_deviation: 0.6
  observations:
    jo type: evolving gaussian
    observers:
    - obs error:
        covariance model: diagonal
      obs space:
        obsdatain:
          obsfile: Data/truth4d.2010-01-02T00:00:00Z.obt
        obsdataout:
          obsfile: Data/4dvar_nongaussian.2010-01-02T00:00:00Z.obt
      obs operator: {}
      non gaussian cost:
        mode: 0.0
        grid spacing: 0.25
        stable min: -3.0
        stable max: 3.0
        log slopes: [0.669724, 0.728092, 0.796896, 0.878894, 0.977676, 1.097741,
                     1.243992, 1.418999, 1.611975, 1.759015, 1.628223, 0.744879,
                     -0.744879, -1.628223, -1.759015, -1.611975, -1.418999, -1.243992,
                     -1.097741, -0.977676, -0.878894, -0.796896, -0.728092, -0.669724]
        left log slope: 0.6437768240
        left curvature: -0.05
        right log slope: -0.6437768240
        right curvature: -0.05
        sigma at mode: 0.4
        mode window: 0.25
        save evolving sigma: true
        evolving sigma group: EvolvingSigma
  constraints:
  - jcdfi:
      filtered variables: [x]
      alpha: 100.0
      cutoff: PT3H
variational:
  minimizer:
    algorithm: DRIPCG
  iterations:
  - gradient norm reduction: 1e-10
    linear model:
      trajectory:
        f: 8.0
        tstep: PT1H30M
      tstep: PT1H30M
      variable change: Identity
      name: L95TLM
    ninner: 10
    geometry:
      resol: 40
  - gradient norm reduction: 1e-10
    linear model:
      trajectory:
        f: 8.0
        tstep: PT1H30M
      tstep: PT1H30M
      variable change: Identity
      name: L95TLM
    ninner: 10
    geometry:
      resol: 40
final:
  prints:
    frequency: PT1H30M
  increment:
    geometry:
      resol: 40
    output:
      state component:
        datadir: Data
        exp: 4dvar_nongaussian
        date: 2010-01-01T03:00:00Z
        type: in
output:
  datadir: Data
  exp: 4dvar_nongaussian
  first: PT3H
  frequency: PT06H
  type: an

test:
  reference filename: testoutput/4dvar_nongaussian.test
  test output filename: testoutput/4dvar_nongaussian.test.out
