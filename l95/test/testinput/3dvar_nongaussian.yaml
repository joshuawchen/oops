# Non-Gaussian 3D-Var run for l95.
#
# Unlike 3dvar_evolvinggaussian.yaml, which uses a density that IS Gaussian in
# order to prove equivalence with the stock cost function, this configuration
# uses a genuinely SKEWED, heavy-tailed density. It is the only test in which
# the non-Gaussian code path actually does something different from the
# Gaussian one, so it is what would catch a sign error or a wrong branch that
# happens to cancel in the symmetric case.
#
# The density targets sigma_o^2(d) = 0.16 + 0.5 d^2, so the effective error
# matches the l95 observation error of 0.4 at the mode and inflates for
# outliers:
#     d     0.1    0.5    1.0    1.5    2.0    3.0
#     sig   0.400  0.533  0.837  1.169  1.509  2.159
# The interior log slopes are therefore -c/sigma_o^2(c) at each bin centre c,
# and the quadratic-log tails continue the trend with a gentle curvature.
#
# Expected behaviour relative to 3dvar.yaml: observations far from the
# background are trusted less, so the initial Jo should be SMALLER than the
# Gaussian 1.1454e+02 and the analysis should sit slightly closer to the
# background in the presence of outliers.

cost function:
  cost type: 3D-Var
  time window:
    begin: 2010-01-01T21:00:00Z
    length: PT6H
  geometry:
    resol: 40
  analysis variables: [x]
  background:
    date: 2010-01-02T00:00:00Z
    filename: Data/forecast.fc.2010-01-01T00:00:00Z.P1D.l95
  background error:
    covariance model: L95Error
    date: 2010-01-02T00:00:00Z
    length_scale: 1.0
    standard_deviation: 0.6
  observations:
    jo type: evolving gaussian
    observers:
    - obs operator: {}
      obs space:
        obsdatain:
          obsfile: Data/truth3d.2010-01-02T00:00:00Z.obt
        obsdataout:
          obsfile: Data/3dvar_nongaussian.2010-01-02T00:00:00Z.obt
      obs error:
        covariance model: diagonal
      non gaussian cost:
        mode: 0.0
        grid spacing: 0.25
        stable min: -3.0
        stable max: 3.0
        log slopes: [0.669724, 0.728092, 0.796896, 0.878894, 0.977676, 1.097741,
                     1.243992, 1.418999, 1.611975, 1.759015, 1.628223, 0.744879,
                     -0.744879, -1.628223, -1.759015, -1.611975, -1.418999, -1.243992,
                     -1.097741, -0.977676, -0.878894, -0.796896, -0.728092, -0.669724]
        left log slope: 0.6437768240
        left curvature: -0.05
        right log slope: -0.6437768240
        right curvature: -0.05
        sigma at mode: 0.4
        mode window: 0.25
        save evolving sigma: true
        evolving sigma group: EvolvingSigma
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
final:
  increment:
    geometry:
      resol: 40
    output:
      state component:
        datadir: Data
        exp: 3dvar_nongaussian
        date: 2010-01-02T00:00:00Z
        type: in
output:
  datadir: Data
  exp: 3dvar_nongaussian
  times: ["2010-01-02T00:00:00Z"]
  type: an

test:
  reference filename: testoutput/3dvar_nongaussian.test
