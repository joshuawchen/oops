cost function:
  cost type: 4D-Var
  time window:
    begin: 2010-01-01T03:00:00Z
    length: P1D
  geometry:
    resol: 40
  model:
    f: 8.0
    name: L95
    tstep: PT1H30M
  analysis variables: [x]
  background:
    date: 2010-01-01T03:00:00Z
    filename: Data/forecast.fc.2010-01-01T00:00:00Z.PT3H.l95
  background error:
    covariance model: L95Error
    date: 2010-01-01T03:00:00Z
    length_scale: 1.0
    standard_deviation: 0.6
  observations:
    jo type: evolving gaussian
    observers:
    - obs error:
        covariance model: diagonal
      obs space:
        obsdatain:
          obsfile: Data/truth4d.2010-01-02T00:00:00Z.obt
        obsdataout:
          obsfile: Data/4dvar_gaussequiv.2010-01-02T00:00:00Z.obt
      obs operator: {}
      non gaussian cost:
        mode: 0.0
        # degenerate interior: all departures fall in the exact tails
        grid spacing: 2.0e-6
        stable min: -1.0e-6
        stable max: 1.0e-6
        log slopes: [0.0]
        # exact Gaussian tails for sigma^2 = 0.16
        left log slope: 6.25e-6
        left curvature: -6.25
        right log slope: -6.25e-6
        right curvature: -6.25
        sigma at mode: 0.4
        mode window: 0.0
  constraints:
  - jcdfi:
      filtered variables: [x]
      alpha: 100.0
      cutoff: PT3H
variational:
  minimizer:
    algorithm: DRIPCG
  iterations:
  - gradient norm reduction: 1e-10
    linear model:
      trajectory:
        f: 8.0
        tstep: PT1H30M
      tstep: PT1H30M
      variable change: Identity
      name: L95TLM
    ninner: 10
    geometry:
      resol: 40
  - gradient norm reduction: 1e-10
    linear model:
      trajectory:
        f: 8.0
        tstep: PT1H30M
      tstep: PT1H30M
      variable change: Identity
      name: L95TLM
    ninner: 10
    geometry:
      resol: 40
final:
  prints:
    frequency: PT1H30M
  increment:
    geometry:
      resol: 40
    output:
      state component:
        datadir: Data
        exp: 4dvar_gaussequiv
        date: 2010-01-01T03:00:00Z
        type: in
output:
  datadir: Data
  exp: 4dvar_gaussequiv
  first: PT3H
  frequency: PT06H
  type: an

test:
  reference filename: testoutput/4dvar_gaussequiv.test
  test output filename: testoutput/4dvar_gaussequiv.test.out
