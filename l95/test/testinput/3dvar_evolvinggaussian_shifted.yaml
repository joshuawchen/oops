# Sign-convention and joValue check, run manually (no ctest reference yet).
#
# Same exact-Gaussian construction as 3dvar_evolvinggaussian.yaml, with the
# mode moved to +0.3 in the variable the code evaluates (H(x) - y). l95 adds
# obs bias to H(x), so this run must match 3dvar_gaussbias_minus.yaml
# (bias -0.3) and differ from 3dvar_gaussbias_plus.yaml. Which one matches
# pins the departure sign convention end to end.

cost function:
  cost type: 3D-Var
  time window:
    begin: 2010-01-01T21:00:00Z
    length: PT6H
  geometry:
    resol: 40
  analysis variables: [x]
  background:
    date: 2010-01-02T00:00:00Z
    filename: Data/forecast.fc.2010-01-01T00:00:00Z.P1D.l95
  background error:
    covariance model: L95Error
    date: 2010-01-02T00:00:00Z
    length_scale: 1.0
    standard_deviation: 0.6
  observations:
    jo type: evolving gaussian
    observers:
    - obs operator: {}
      obs space:
        obsdatain:
          obsfile: Data/truth3d.2010-01-02T00:00:00Z.obt
        obsdataout:
          obsfile: Data/3dvar_evolvinggaussian_shifted.2010-01-02T00:00:00Z.obt
      obs error:
        covariance model: diagonal
      non gaussian cost:
        mode: 0.3
        # degenerate interior about the mode: all departures hit the tails
        grid spacing: 2.0e-6
        stable min: 0.2999990
        stable max: 0.3000010
        log slopes: [0.0]
        # exact Gaussian tails for sigma^2 = 0.16, centered at the mode
        left log slope: 6.25e-6
        left curvature: -6.25
        right log slope: -6.25e-6
        right curvature: -6.25
        sigma at mode: 0.4
        mode window: 0.0
        save evolving sigma: true
        evolving sigma group: EvolvingSigma
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
output:
  datadir: Data
  exp: 3dvar_evolvinggaussian_shifted
  times: ["2010-01-02T00:00:00Z"]
  type: an
