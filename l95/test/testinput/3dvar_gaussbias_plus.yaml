# Gaussian control with a fixed obs bias of +0.3. Expected to DIFFER from
# 3dvar_evolvinggaussian_shifted.yaml; agreement here instead of with the
# minus run would mean the sign convention is the opposite of the derivation.

cost function:
  cost type: 3D-Var
  time window:
    begin: 2010-01-01T21:00:00Z
    length: PT6H
  geometry:
    resol: 40
  analysis variables: [x]
  background:
    date: 2010-01-02T00:00:00Z
    filename: Data/forecast.fc.2010-01-01T00:00:00Z.P1D.l95
  background error:
    covariance model: L95Error
    date: 2010-01-02T00:00:00Z
    length_scale: 1.0
    standard_deviation: 0.6
  observations:
    observers:
    - obs operator: {}
      obs space:
        obsdatain:
          obsfile: Data/truth3d.2010-01-02T00:00:00Z.obt
        obsdataout:
          obsfile: Data/3dvar_gaussbias_plus.2010-01-02T00:00:00Z.obt
      obs error:
        covariance model: diagonal
      obs bias:
        bias: 0.3
        covariance:
          standard_deviation: 1.0e-8
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
  - ninner: 10
    gradient norm reduction: 1e-10
    geometry:
      resol: 40
output:
  datadir: Data
  exp: 3dvar_gaussbias_plus
  times: ["2010-01-02T00:00:00Z"]
  type: an
